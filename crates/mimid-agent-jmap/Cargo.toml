[package]
name = "mimid-agent-jmap"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "JMAP Chat over mimid-agent-core: a user's MIMI rooms as Chats and Messages"

# A library with no transport and no tokio runtime of its own (bead
# mimid-1wgh.13.9; decision mimid-1wgh.39): the daemon (A3) or an app
# serves the dispatcher and drives sync.
[dependencies]
# Subscription ids and verification codes (push.rs); the version mimid uses.
getrandom = "=0.3.4"
# POSTs to push services (push_deliver.rs); the version and features
# mimid-agent-core and the IRC front end use.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
mimid-agent-core = { path = "../mimid-agent-core" }
mimid-agent-store = { path = "../mimid-agent-store" }
# The crate-jmap revision mimid-server uses.
jmap-chat-server = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "1a58c94f", features = ["memory"] }
jmap-chat-types = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "1a58c94f" }
jmap-server = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "1a58c94f" }
jmap-types = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "1a58c94f" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Only the async Mutex around the Agent.
tokio = { version = "1.53.3", default-features = false, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
base64 = "=0.22.1"
mimi-content = { path = "../mimi-content" }
mimi-mls = { path = "../mimi-mls" }
mimi-protocol = { path = "../mimi-protocol" }
mimi-room-policy = { path = "../mimi-room-policy" }
mimid-server = { path = "../mimid-server" }
# A plain OpenMLS client whose leaf lacks AppDataUpdate, which no mimid
# agent can add (tests/removal_notice.rs). Same versions as mimi-mls.
openmls.workspace = true
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto.workspace = true
# An mls-rs client in the same place (tests/removal_notice.rs), the
# independent oracle pinned per decision mimid-1wgh.4.13. Its
# IdentityProvider needs MemberValidationContext, which mls-rs does not
# re-export.
mls-rs = { git = "https://github.com/awslabs/mls-rs", rev = "d9af9507223e4c915db9599f6038da1de5d68d4b" }
mls-rs-core = { git = "https://github.com/awslabs/mls-rs", rev = "d9af9507223e4c915db9599f6038da1de5d68d4b" }
mls-rs-crypto-rustcrypto = { git = "https://github.com/awslabs/mls-rs", rev = "d9af9507223e4c915db9599f6038da1de5d68d4b" }
# The version and features mimid-agent-core uses.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# Reading the store's tables in the agent's database (tests/chat_delete.rs);
# the version mimid-agent-store uses.
rusqlite = "=0.37.0"
# The digests of attachments in tests/two_accounts.rs.
sha2.workspace = true
tempfile = "=3.23.0"
tokio.workspace = true
tracing-subscriber.workspace = true
