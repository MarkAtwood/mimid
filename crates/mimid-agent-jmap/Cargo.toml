[package]
name = "mimid-agent-jmap"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "JMAP Chat over mimid-agent-core: a user's MIMI rooms as Chats and Messages"

# A library with no transport and no tokio runtime of its own (bead
# mimid-1wgh.13.9; decision mimid-1wgh.39): the daemon (A3) or an app
# serves the dispatcher and drives sync.
[dependencies]
mimid-agent-core = { path = "../mimid-agent-core" }
mimi-content = { path = "../mimi-content" }
# The crate-jmap revision mimid-server uses.
jmap-chat-server = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "83a08405c641138ffe9e8e99094ab602e9a26256", features = ["memory"] }
jmap-chat-types = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "83a08405c641138ffe9e8e99094ab602e9a26256" }
jmap-server = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "83a08405c641138ffe9e8e99094ab602e9a26256" }
jmap-types = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "83a08405c641138ffe9e8e99094ab602e9a26256" }
serde.workspace = true
serde_json.workspace = true
# Blob ids are the SHA-256 of the content.
sha2.workspace = true
thiserror.workspace = true
# Only the async Mutex around the Agent.
tokio = { version = "1.53.3", default-features = false, features = ["sync"] }
tracing.workspace = true
# The version mimid-server uses.
ulid = "=3.0.0"

[dev-dependencies]
axum.workspace = true
mimid-server = { path = "../mimid-server" }
tempfile = "=3.23.0"
tokio.workspace = true
