[package]
name = "mimid-telemetry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "mimid's log format, OpenTelemetry export and refusal counters, shared by the server and the agent"

# A leaf crate: it depends on no other mimid crate, so both binaries and
# the libraries under them can depend on it (bead mimid-c90r).
[dependencies]
# The metrics API, not the SDK: the global meter provider is set here,
# and each binary builds the instruments it names itself.
opentelemetry = { version = "=0.33.1", default-features = false, features = ["metrics"] }
tracing.workspace = true
# `export` only, from here down.
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace", "logs", "metrics"], optional = true }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "logs", "metrics"], optional = true }
opentelemetry-appender-tracing = { version = "=0.33.1", default-features = false, optional = true }
tracing-opentelemetry = { version = "=0.34.0", default-features = false, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
# json: the JsonFields the JSON formatter reads a span's fields from.
tracing-subscriber = { workspace = true, features = ["json"], optional = true }

[features]
# The subscriber side: the JSON log format and the OTLP exporters, which
# the two binaries turn on.
export = [
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:tracing-opentelemetry",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tracing-subscriber",
    "opentelemetry/trace",
    "opentelemetry/logs",
]
# The JSON capture of `logging::testing`, for another crate's tests.
testing = ["export"]

[dev-dependencies]
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace", "logs", "metrics", "testing"] }
serde_json.workspace = true
toml.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
