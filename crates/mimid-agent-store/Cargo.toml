[package]
name = "mimid-agent-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The plaintext layer of mimid-agent, shared by its front ends: blobs, messages, notices"

# No crate-jmap and no IRC code (docs/design/agent-frontends.md §2): the
# front ends depend on this crate, never the other way.
[dependencies]
# SCRAM messages carry base64 (credentials::scram); the version mimid uses.
# RFC 8291 Web Push encryption and RFC 8292 VAPID (push_crypto), beside
# the subscriptions and VAPID key the push module already keeps. The
# RustCrypto crates and versions already in the build: aes-gcm as
# mimid-agent-core, hkdf for sha2 0.11, p256 as pkix-path.
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
hkdf = "=0.13.0"
p256 = { version = "=0.13.2", features = ["ecdh", "ecdsa"] }
# App passwords, the SCRAM salt and nonces (credentials); already in the
# lockfile.
getrandom = "=0.3.4"
mimid-agent-core = { path = "../mimid-agent-core" }
mimi-content = { path = "../mimi-content" }
# The store's database: the rusqlite openmls_sqlite_storage (mimi-mls's
# MLS store) uses, so the workspace has one SQLite.
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde.workspace = true
# The store file, and the front ends' extensions in it.
serde_json.workspace = true
# Attachment links carry an HMAC-SHA256 (links.rs).
hmac.workspace = true
# Blob ids and notice keys are SHA-256 digests.
sha2.workspace = true
# Constant-time comparison of SCRAM keys (credentials); already in the
# lockfile.
subtle = "=2.6.1"
thiserror.workspace = true
# The async Mutex around the Agent, the watch of credential changes, and
# the runner's tasks and timers.
tokio = { version = "1.53.3", default-features = false, features = ["sync", "rt", "time", "macros"] }
tracing.workspace = true
# The version mimid-server and mimid-agent-jmap use.
ulid = "=3.0.0"

[dev-dependencies]
axum.workspace = true
hex = "0.4.3"
# The crash tests (tests/crash.rs) make one step of receiving or
# acknowledging fail (Agent::fail_next).
mimid-agent-core = { path = "../mimid-agent-core", features = ["fail-points"] }
# The hub the crash tests' agents talk to.
mimid-server = { path = "../mimid-server" }
tempfile = "=3.23.0"
tokio.workspace = true
