[package]
name = "mimid-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "MIMI provider server (hub and follower roles) for the mimid reference implementation"

[[bin]]
name = "mimid"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
# Retry-After HTTP-date parsing (RFC 9110 §10.2.3); already in the lockfile.
httpdate = "1.0.3"
# Reads the salt and URIs of reported messages (protocol-06 §5.9).
mimi-content = { path = "../mimi-content" }
mimi-mls = { path = "../mimi-mls" }
mimi-protocol = { path = "../mimi-protocol" }
mimi-room-policy = { path = "../mimi-room-policy" }
# rustls with its default aws-lc-rs provider (decisions mimid-1wgh.26, .6.16).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde.workspace = true
# Request hashes for submitMessage retry deduplication.
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Encodes secrets for the log canary; already in the lockfile.
base64 = "=0.22.1"
# Independent oracle, at the pin mimi-mls uses (decisions mimid-1wgh.4.13, .6.16).
mls-rs = { git = "https://github.com/awslabs/mls-rs", rev = "d9af9507223e4c915db9599f6038da1de5d68d4b" }
mls-rs-crypto-rustcrypto = { git = "https://github.com/awslabs/mls-rs", rev = "d9af9507223e4c915db9599f6038da1de5d68d4b" }
serde_json.workspace = true
tempfile = "=3.23.0"
tower = { version = "=0.5.2", features = ["util"] }
