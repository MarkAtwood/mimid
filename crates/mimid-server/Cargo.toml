[package]
name = "mimid-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "MIMI provider server (hub and follower roles) for the mimid reference implementation"

[[bin]]
name = "mimid"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
serde.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile = "=3.23.0"
tower = { version = "=0.5.2", features = ["util"] }
