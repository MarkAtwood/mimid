[package]
name = "mimid-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "MIMI provider server (hub and follower roles) for the mimid reference implementation"

[[bin]]
name = "mimid"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# ws: the live stream (docs/design/binary-live-stream.md); its
# tokio-tungstenite is the version already in the lockfile.
axum = { workspace = true, features = ["ws"] }
# Splits the live stream's WebSocket into reader and writer; already in
# the lockfile.
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
# Unpadded base64url JMAP bearer tokens (mimid-1wgh.11.1); already in the lockfile.
base64 = "=0.22.1"
# JMAP request parsing and method dispatch (RFC 8620), and the JMAP Chat
# capability types; exact rev pin (decision mimid-1wgh.12.21).
jmap-chat-types = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "e4d206ea400b7a65001bd62e393d9efbca744db8" }
jmap-server = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "e4d206ea400b7a65001bd62e393d9efbca744db8" }
# draft-atwood-jmap-updates-00 language tags and localizations (bead
# mimid-nb5n); same rev.
jmap-types = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "e4d206ea400b7a65001bd62e393d9efbca744db8" }
# draft-ietf-jmap-metadata-05 helpers for Chat.privateMetadata (decision
# mimid-1wgh.63); same rev.
jmap-metadata-server = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "e4d206ea400b7a65001bd62e393d9efbca744db8" }
jmap-metadata-types = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "e4d206ea400b7a65001bd62e393d9efbca744db8" }
jmap-chat-mimi-types = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "e4d206ea400b7a65001bd62e393d9efbca744db8" }
# draft-ietf-jmap-blobext-03 Blob/get, set, lookup and convert (bead
# mimid-1wgh.14.7).
jmap-blob-server = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "e4d206ea400b7a65001bd62e393d9efbca744db8" }
jmap-blob-types = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "e4d206ea400b7a65001bd62e393d9efbca744db8" }
# RFC 9421 Ed25519 request signatures (bead mimid-75nk.2); already in
# the lockfile through OpenMLS.
ed25519-dalek = "=2.2.0"
# DNS-published provider keys (bead mimid-75nk.3): a validating stub
# resolver; aws-lc-rs as elsewhere (decision mimid-1wgh.26).
hickory-resolver = { version = "=0.26.3", features = ["dnssec-aws-lc-rs"] }
# mimid's own TLS listener with optional client certificates (bead
# mimid-75nk.4); all already in the lockfile through reqwest.
hyper = { version = "=1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "=0.1.21", features = ["server-auto", "tokio"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs"] }
tower = { version = "=0.5.2", features = ["util"] }
# PKIX client certificates (bead mimid-75nk.5): RFC 5280 path validation
# and RFC 9525 DNS-ID matching from crate-pkix, exact rev pin (decision of
# mimid-75nk: git, pinned rev), with its RustCrypto RSA and ECDSA
# verifiers; x509-cert and der at the versions crate-pkix uses.
pkix-path = { git = "https://github.com/MarkAtwood/crate-pkix", rev = "1a02f504db1640c916f670081be64c5eddf3ce9d", default-features = false, features = ["std", "rsa", "p256", "p384"] }
pkix-identity = { git = "https://github.com/MarkAtwood/crate-pkix", rev = "1a02f504db1640c916f670081be64c5eddf3ce9d", features = ["std"] }
x509-cert = { version = "=0.2.5", default-features = false, features = ["std"] }
der = { version = "=0.7.10", features = ["std"] }
# OpenTelemetry export (bead mimid-ndov): tracing stays the API; these
# turn its spans and events into OTel traces and logs, add metrics, and
# export over OTLP/HTTP with the blocking reqwest client (the SDK's batch
# processors run on their own threads), the reqwest version mimid uses.
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace", "logs", "metrics"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace", "logs", "metrics"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "logs", "metrics"] }
opentelemetry-appender-tracing = { version = "=0.33.1", default-features = false }
tracing-opentelemetry = { version = "=0.34.0", default-features = false }
# Retry-After HTTP-date parsing (RFC 9110 §10.2.3); already in the lockfile.
httpdate = "1.0.3"
# Reads the salt and URIs of reported messages (protocol-07 §5.9).
mimi-content = { path = "../mimi-content" }
mimi-mls = { path = "../mimi-mls" }
mimi-protocol = { path = "../mimi-protocol" }
mimid-live = { path = "../mimid-live" }
mimi-room-policy = { path = "../mimi-room-policy" }
# rustls with its default aws-lc-rs provider (decisions mimid-1wgh.26, .6.16).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde.workspace = true
serde_json.workspace = true
# RFC 9651 structured fields: Signature-Input, Signature and
# Content-Digest (bead mimid-75nk.2).
sfv = "=0.14.0"
# Request hashes for submitMessage retry deduplication.
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tracing.workspace = true
# json: the MIMID_LOG_FORMAT=json output (bead mimid-bfzm).
tracing-subscriber = { workspace = true, features = ["json"] }
# Per-request spans on the axum router (bead mimid-bfzm); already in the
# lockfile through reqwest.
tower-http = { version = "=0.6.11", features = ["trace"] }
# Wipes the request-signing seed when dropped (bead mimid-75nk.1); already
# in the lockfile.
zeroize = "1.9.1"
# ULID account, Chat and Message ids (base JMAP Chat; decision mimid-1wgh.12.31).
ulid = "=3.0.0"

[dev-dependencies]
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace", "logs", "metrics", "testing"] }
unicode-normalization.workspace = true
# Independent oracle, at the pin mimi-mls uses (decisions mimid-1wgh.4.13, .6.16).
mls-rs = { git = "https://github.com/awslabs/mls-rs", rev = "d9af9507223e4c915db9599f6038da1de5d68d4b" }
mls-rs-crypto-rustcrypto = { git = "https://github.com/awslabs/mls-rs", rev = "d9af9507223e4c915db9599f6038da1de5d68d4b" }
# A plain OpenMLS proposer for AppDataUpdate tests: mls-rs cannot send an
# AppDataUpdate, and mimi-mls's Member refuses to build some invalid ones
# (bead mimid-1wgh.6.73). Same versions as mimi-mls.
openmls.workspace = true
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto.workspace = true
tempfile = "=3.23.0"
# A WebSocket client for the live stream tests; the version already in
# the lockfile.
tokio-tungstenite = "=0.29.0"
tower = { version = "=0.5.2", features = ["util"] }
