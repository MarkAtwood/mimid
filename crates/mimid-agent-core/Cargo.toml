[package]
name = "mimid-agent-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The client engine of mimid-agent: MIMI rooms through a mimid server's JMAP API"

# No UI, no HTTP server and no tokio runtime of its own (bead
# mimid-1wgh.13.8; mimid-1wgh.39: a mobile app embeds it). The async fns run
# on the caller's runtime.
[dependencies]
# AES-128-GCM for attachments (mimi-content-10 §4.5 MTI); the version
# OpenMLS's RustCrypto provider already uses.
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
hex = "0.4.3"
mimi-content = { path = "../mimi-content" }
mimi-mls = { path = "../mimi-mls" }
mimi-protocol = { path = "../mimi-protocol" }
mimi-room-policy = { path = "../mimi-room-policy" }
mimid-live = { path = "../mimid-live" }
# The live stream binding (docs/design/binary-live-stream.md): a WebSocket
# client with the features crate-jmap already pulls in, and the tasks and
# channels around it, on the caller's runtime.
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
tokio = { workspace = true }
# The version and features mimid-server uses, so one HTTP and TLS stack.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# The agent's database: the rusqlite openmls_sqlite_storage (mimi-mls's MLS
# store) uses, since the agent's tables share its connection.
rusqlite = "=0.37.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# Tests only: Agent::fail_next, which makes one step of receiving or
# acknowledging fail, for the crash tests of the agent and its store
# (bead mimid-1vul.10). Never enabled by a build that ships.
fail-points = []

[dev-dependencies]
axum.workspace = true
mimid-server = { path = "../mimid-server" }
tempfile = "=3.23.0"
tokio.workspace = true
