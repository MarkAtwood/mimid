[package]
name = "mls-didwebvh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "draft-atwood-mls-didwebvh-credential-00: the did_webvh MLS credential, its log verification and group rules, for mimid"

[dependencies]
# The controller side signs log entries (eddsa-jcs-2022); the version
# jmap-did-types already brings in.
ed25519-dalek = "=3.0.0"
# did:webvh v1.0 Read (Resolve) verification over supplied bytes (decision
# mimid-1wgh.4.81.7). The crate-jmap revision the rest of mimid uses.
jmap-did-types = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "f35cb6dfeffbed12baae2379de3c04011abd7e6f" }
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true
