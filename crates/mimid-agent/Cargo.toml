[package]
name = "mimid-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The mimid-agent daemon: a user's MIMI rooms as a local JMAP Chat endpoint and IRC server"

[[bin]]
name = "mimid-agent"
path = "src/main.rs"

# The daemon of bead mimid-1wgh.13.10: serves mimid-agent-jmap's
# dispatcher on a loopback listener and drives its sync. It must not
# depend on mimid-server (its JMAP layer is copied, not shared).
[dependencies]
anyhow.workspace = true
# "ws": the JMAP WebSocket of RFC 8887 (src/http.rs get_websocket).
axum = { workspace = true, features = ["ws"] }
# The local bearer token, unpadded base64url; the version mimid uses.
base64 = "=0.22.1"
# 32 octets of the OS RNG for the local bearer token; already in the
# lockfile.
getrandom = "=0.3.4"
# The crate-jmap revision mimid-agent-jmap uses.
jmap-chat-types = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "a28bf508" }
jmap-server = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "a28bf508" }
# RFC 8887: the agent serves a JMAP WebSocket, which is how an
# ephemeral event reaches a client (bead mimid-1wgh.100).
jmap-websocket = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "a28bf508", features = ["server"] }
mimid-agent-core = { path = "../mimid-agent-core" }
# The IRC front end over the store, with [irc].
mimid-agent-irc = { path = "../mimid-agent-irc" }
mimid-agent-jmap = { path = "../mimid-agent-jmap" }
# The plaintext store the daemon builds first and its front ends share.
mimid-agent-store = { path = "../mimid-agent-store" }
# The log format and the OpenTelemetry export, shared with mimid-server
# (bead mimid-c90r): before it, the agent named its events for a reader
# that could not show a name.
mimid-telemetry = { path = "../mimid-telemetry", features = ["export"] }
# `[tls] source = "acme"` (docs/design/frontend-auth.md §5.2 rank 2; bead
# mimid-e13m.8): the ACME client. It takes any challenge type, so DNS-01
# is mimid's code. aws-lc-rs for the one crypto backend (decision
# mimid-1wgh.26), and `rcgen` so it builds the CSR with the rcgen below
# rather than pulling a second copy.
instant-acme = { version = "=0.8.5", default-features = false, features = [
    "aws-lc-rs",
    "hyper-rustls",
    "rcgen",
] }
# `[tls.acme] dns = "acme-dns"` posts the challenge value to an acme-dns
# instance (bead mimid-e13m.8.2); the version and features
# mimid-agent-core already uses.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# `[tls] source = "local-ca"` (docs/design/frontend-auth.md §5.2 rank 4,
# §6.6; bead mimid-e13m.9): the name-constrained CA and its leaf. aws-lc-rs
# and not ring, as decision mimid-1wgh.26 picked for rustls, so the binary
# carries one crypto backend.
rcgen = { version = "=0.14.5", default-features = false, features = ["aws_lc_rs", "pem"] }
# rcgen's certificate validity dates are `time::OffsetDateTime`; already in
# the lockfile. "formatting" for the RFC 3339 `not_after` that
# docs/design/frontend-auth.md §7.2 asks the certificate lines to carry.
time = { version = "=0.3.55", default-features = false, features = [
    "std",
    "formatting",
] }
# The terminal QR code of `setup goguma` (docs/design/frontend-auth.md
# §6.1); no image or SVG output. 0.14.1 is from 2024.
qrcode = { version = "=0.14.1", default-features = false }
# TLS for the front ends' network listeners (docs/design/frontend-auth.md
# §5), as mimid-server has it: aws-lc-rs (decision mimid-1wgh.26); already
# in the lockfile.
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
# The Session state and the account id.
# The attachment link key, from the local token (token.rs).
hmac.workspace = true
sha2.workspace = true
# Constant-time comparison of the local bearer token; already in the
# lockfile.
subtle = "=2.6.1"
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs"] }
# The Stream and Sink adapters the JMAP WebSocket needs to put axum's
# frames through the crate's Connection (src/http.rs).
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
tokio-stream.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The stock Rust JMAP Chat client the acceptance test drives the daemon
# with (bead mimid-1wgh.13.11), at the crate-jmap revision above; it
# brings its own reqwest 0.12.
futures = "0.3.34"
jmap-base-client = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "a28bf508" }
jmap-chat-client = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "a28bf508" }
jmap-types = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "a28bf508" }
# The invite-name tests (tests/common/irc.rs) make reading a Welcome
# fail once (Agent::fail_next), for the `&invite-<n>` fallback.
mimid-agent-core = { path = "../mimid-agent-core", features = ["fail-points"] }
# The calls test sends mimi-content-10 §5.10's conferencing example.
mimi-content = { path = "../mimi-content" }
mimid-server = { path = "../mimid-server" }
tempfile = "=3.23.0"
# A JMAP WebSocket client for the call-negotiation test (bead
# mimid-1wgh.114.10): the agent's `/jmap/ws` is the only way an ephemeral
# VTCCallSignal reaches a client, so a test of a call has to speak it. The
# version mimid-server's live-stream tests already use.
tokio-tungstenite = "=0.29.0"
# The local CA's name constraint is the security property of bead
# mimid-e13m.9, so a real path verifier checks it rather than a look at
# the DER. The version rustls already pulls in.
webpki = { package = "rustls-webpki", version = "=0.103.15", default-features = false, features = ["std", "aws-lc-rs"] }
# The fake Web Push client of tests/common/webpush.rs decrypts pushes
# (RFC 8291) and checks VAPID (RFC 8292) with the crates and versions
# mimid-agent-irc uses.
aes-gcm = "=0.10.3"
hkdf = "=0.13.0"
p256 = { version = "=0.13.2", features = ["ecdh", "ecdsa"] }
