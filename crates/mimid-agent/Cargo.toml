[package]
name = "mimid-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The mimid-agent daemon: a user's MIMI rooms as a local JMAP Chat endpoint and IRC server"

[[bin]]
name = "mimid-agent"
path = "src/main.rs"

# The daemon of bead mimid-1wgh.13.10: serves mimid-agent-jmap's
# dispatcher on a loopback listener and drives its sync. It must not
# depend on mimid-server (its JMAP layer is copied, not shared).
[dependencies]
anyhow.workspace = true
axum.workspace = true
# The local bearer token, unpadded base64url; the version mimid uses.
base64 = "=0.22.1"
# 32 octets of the OS RNG for the local bearer token; already in the
# lockfile.
getrandom = "=0.3.4"
# The crate-jmap revision mimid-agent-jmap uses.
jmap-chat-types = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "e4d206ea400b7a65001bd62e393d9efbca744db8" }
jmap-server = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "e4d206ea400b7a65001bd62e393d9efbca744db8" }
mimid-agent-core = { path = "../mimid-agent-core" }
# The IRC front end over the store, with [irc].
mimid-agent-irc = { path = "../mimid-agent-irc" }
mimid-agent-jmap = { path = "../mimid-agent-jmap" }
# The plaintext store the daemon builds first and its front ends share.
mimid-agent-store = { path = "../mimid-agent-store" }
serde.workspace = true
serde_json.workspace = true
# The Session state and the account id.
sha2.workspace = true
# Constant-time comparison of the local bearer token; already in the
# lockfile.
subtle = "=2.6.1"
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The stock Rust JMAP Chat client the acceptance test drives the daemon
# with (bead mimid-1wgh.13.11), at the crate-jmap revision above; it
# brings its own reqwest 0.12.
futures = "0.3.34"
jmap-base-client = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "e4d206ea400b7a65001bd62e393d9efbca744db8" }
jmap-chat-client = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "e4d206ea400b7a65001bd62e393d9efbca744db8" }
jmap-types = { git = "https://github.com/MarkAtwood/crate-jmap", rev = "e4d206ea400b7a65001bd62e393d9efbca744db8" }
# The invite-name tests (tests/common/irc.rs) make reading a Welcome
# fail once (Agent::fail_next), for the `&invite-<n>` fallback.
mimid-agent-core = { path = "../mimid-agent-core", features = ["fail-points"] }
# The calls test sends mimi-content-10 §5.10's conferencing example.
mimi-content = { path = "../mimi-content" }
mimid-server = { path = "../mimid-server" }
# The version and features mimid-agent-core uses.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tempfile = "=3.23.0"
