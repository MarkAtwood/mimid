[package]
name = "mimid-agent-irc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The IRC front end of mimid-agent: a loopback IRC server over the plaintext store"

# No IRC library (docs/design/agent-frontends.md §4): the parser is small,
# and docs/irc-lessons.md lists exact behaviour a library would hide.
[dependencies]
# soju.im/webpush: RFC 8291 message encryption (push_crypto.rs), with
# the RustCrypto crates and versions already in the build (aes-gcm as
# mimid-agent-core, hkdf for sha2 0.11, p256 as pkix-path).
aes-gcm = "=0.10.3"
# The push key pairs and salts; the version mimid uses.
getrandom = "=0.3.4"
hkdf = "=0.13.0"
p256 = { version = "=0.13.2", features = ["ecdh", "ecdsa"] }
# POSTs to push services; the version and features mimid-agent-core uses.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# AUTHENTICATE payloads (sasl.rs); the version mimid uses.
base64 = "=0.22.1"
mimid-agent-store = { path = "../mimid-agent-store" }
# Names kept in a record's ext["irc"].
serde_json.workspace = true
# The 4-character suffix of a colliding nick or channel name.
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.3", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# The TLS listener (docs/design/frontend-auth.md §5); the daemon makes the
# rustls configuration. The version mimid-server uses.
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs"] }
tracing.workspace = true
# The msgid of an edit: a ULID like the store's senderMsgId; the version
# mimid-agent-store uses.
ulid = "=3.0.0"
