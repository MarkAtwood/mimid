[package]
name = "mimid-phoenix-xcheck"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not part of the mimid workspace (decision mimid-1wgh.46.4).
[workspace]

# phnx-im/mimi-content at two revisions, under two names. Bump a `rev` to
# test a newer Phoenix. The crate is AGPL-3.0-or-later (REUSE: LICENSES/ and
# REUSE.toml in that repository).
[dependencies]
# main at 9690d8f: draft-ietf-mimi-content-10 (#20, merged 2026-11-03) and
# the decode limits (#21); the revision Phoenix's Air app pins (bead
# mimid-1wgh.46.13).
phx_main = { package = "mimi_content", git = "https://github.com/phnx-im/mimi-content", rev = "9690d8f28a5470695b9fb715e284d7ea59d97fc0" }
# The previous main, 31487f9 (pre-draft-09), the revision of the first
# cross-check (mimid-1wgh.46.2), to show what content-10 changed.
phx_prev = { package = "mimi_content", git = "https://github.com/phnx-im/mimi-content", rev = "31487f9c32bdbdd47b7b946f9756f51663b2b600" }
