[package]
name = "mimid-haven-xcheck"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not part of any workspace.
[workspace]

[dependencies]
# Haven at the commit the committed results refer to; bump `rev` to test a
# newer Haven.
mimi-core = { git = "https://github.com/havenmessenger/interop", rev = "fdce22294eb820f50d50bb9e40f75de29cf86b5b", features = ["test-helpers"] }
# The OpenMLS revision Haven's Cargo.toml pins at that commit.
openmls = { git = "https://github.com/openmls/openmls", rev = "28369d5b48608bef4ddf8371d91503b0f3852bb3" }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", rev = "28369d5b48608bef4ddf8371d91503b0f3852bb3" }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "28369d5b48608bef4ddf8371d91503b0f3852bb3" }
tls_codec = "0.5"
