[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
# Exact pins: OpenMLS's extensions-draft API changes between releases.
openmls = { version = "=0.9.2", features = ["extensions-draft"] }
openmls_rust_crypto = { version = "=0.6.0", features = ["extensions-draft"] }
openmls_sqlite_storage = { version = "=0.3.0", features = ["extensions-draft"] }
openmls_traits = "=0.6.0"

# Exact pins: wire encodings and hashes the spec crates must reproduce byte for byte.
# tls_codec must stay the version openmls uses, since mimi-mls re-exports it.
tls_codec = { version = "=0.5.0", features = ["derive", "mls"] }
minicbor = { version = "=2.3.0", features = ["alloc"] }
sha2 = "=0.11.1"
hmac = "=0.13.0"
serde_json = "=1.0.154"
iri-string = { version = "=0.7.14", default-features = false, features = ["alloc"] }

serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tokio = { version = "1.53.3", features = ["full"] }
axum = "0.8.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
toml = "1.1.8"

# Our OpenMLS branch (mimid-0.9.2): v0.9.2 plus the GREASE KeyPackage
# extension fix (decision mimid-1wgh.4.11) and a PublicGroup leaf-lifetime
# opt-out, LeafNodeLifetimePolicy::Skip (decision mimid-1wgh.4.38), and
# MlsGroup::set_leaf_node_lifetime_policy so members can use it too
# (decision mimid-1wgh.4.56). Every openmls-family crate comes from the same
# commit so they share one openmls_traits; all but openmls are unchanged.
[patch.crates-io]
openmls = { git = "https://github.com/MarkAtwood/openmls", rev = "1f3f1b4bfb2befe0523aea517cc5b01169011990" }
openmls_traits = { git = "https://github.com/MarkAtwood/openmls", rev = "1f3f1b4bfb2befe0523aea517cc5b01169011990" }
openmls_rust_crypto = { git = "https://github.com/MarkAtwood/openmls", rev = "1f3f1b4bfb2befe0523aea517cc5b01169011990" }
openmls_basic_credential = { git = "https://github.com/MarkAtwood/openmls", rev = "1f3f1b4bfb2befe0523aea517cc5b01169011990" }
openmls_sqlite_storage = { git = "https://github.com/MarkAtwood/openmls", rev = "1f3f1b4bfb2befe0523aea517cc5b01169011990" }
openmls_memory_storage = { git = "https://github.com/MarkAtwood/openmls", rev = "1f3f1b4bfb2befe0523aea517cc5b01169011990" }
openmls_serialization_helpers = { git = "https://github.com/MarkAtwood/openmls", rev = "1f3f1b4bfb2befe0523aea517cc5b01169011990" }
