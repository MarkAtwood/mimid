[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Exact pins: OpenMLS's extensions-draft API changes between releases.
openmls = { version = "=0.9.2", features = ["extensions-draft", "semiprivate-message-draft"] }
openmls_rust_crypto = { version = "=0.6.0", features = ["extensions-draft"] }
openmls_sqlite_storage = { version = "=0.3.0", features = ["extensions-draft"] }
openmls_traits = "=0.6.0"

# Exact pins: wire encodings and hashes the spec crates must reproduce byte for byte.
# tls_codec must stay the version openmls uses, since mimi-mls re-exports it.
tls_codec = { version = "=0.5.0", features = ["derive", "mls"] }
minicbor = { version = "=2.3.0", features = ["alloc"] }
sha2 = "=0.11.1"
hmac = "=0.13.0"
serde_json = "=1.0.154"
iri-string = { version = "=0.7.14", default-features = false, features = ["alloc"] }
# Tests only: Unicode normalization forms for the Unicode stress tests (bead
# mimid-1wgh.54); the version already in the lockfile.
unicode-normalization = "=0.1.26"

serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tokio = { version = "1.53.3", features = ["full"] }
axum = "0.8.9"
# The EventSource stream (bead mimid-1wgh.11.6); the version already in the lockfile.
tokio-stream = "=0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
toml = "1.1.8"

# Our OpenMLS branch (mimid-0.9.2): v0.9.2 plus the GREASE KeyPackage
# extension fix (decision mimid-1wgh.4.11) and a PublicGroup leaf-lifetime
# opt-out, LeafNodeLifetimePolicy::Skip (decision mimid-1wgh.4.38), and
# MlsGroup::set_leaf_node_lifetime_policy so members can use it too
# (decision mimid-1wgh.4.56), and CommitIn and FramedContentAuthData exported
# so a consumer can decode a structure that embeds a Commit it did not build
# (semiprivatemessage-08 §3.1's SemiPrivateMessageContent; bead
# mimid-1wgh.4.79.1) with accessors so a consumer need not read their
# fields out of the bytes, and the mls_semiprivate_message wire format
# 0x0011 behind the semiprivate-message-draft feature, so that MLSMessage can
# carry a SemiPrivateMessage at all (semiprivatemessage-08 §5.1; upstream
# PR openmls/openmls#2352). Every openmls-family crate comes from the same
# commit so they share one openmls_traits; all but openmls are unchanged.
[patch.crates-io]
openmls = { git = "https://github.com/MarkAtwood/openmls", rev = "983ba32c7aa3f63dbf7a47222a56167e5b56e3ec" }
openmls_traits = { git = "https://github.com/MarkAtwood/openmls", rev = "983ba32c7aa3f63dbf7a47222a56167e5b56e3ec" }
openmls_rust_crypto = { git = "https://github.com/MarkAtwood/openmls", rev = "983ba32c7aa3f63dbf7a47222a56167e5b56e3ec" }
openmls_basic_credential = { git = "https://github.com/MarkAtwood/openmls", rev = "983ba32c7aa3f63dbf7a47222a56167e5b56e3ec" }
openmls_sqlite_storage = { git = "https://github.com/MarkAtwood/openmls", rev = "983ba32c7aa3f63dbf7a47222a56167e5b56e3ec" }
openmls_memory_storage = { git = "https://github.com/MarkAtwood/openmls", rev = "983ba32c7aa3f63dbf7a47222a56167e5b56e3ec" }
openmls_serialization_helpers = { git = "https://github.com/MarkAtwood/openmls", rev = "983ba32c7aa3f63dbf7a47222a56167e5b56e3ec" }

# Line tables instead of full DWARF. A panic still names the file and
# line, which is what a failing test needs, but a debugger can no longer
# inspect variables: use `RUSTFLAGS="-C debuginfo=2"` or override this
# for a session that needs one.
#
# The workspace builds dozens of integration-test binaries under
# `--all-features --all-targets`, and with full debug info each ran to
# about 650 MB. The gate wrote hundreds of gigabytes per run, which on
# one machine took the CPU to 83% iowait and left `target` at 211 GB.
# The bytes, not the compiling, were the cost.
[profile.dev]
debug = "line-tables-only"

# PBKDF2 of the agent's SCRAM verifiers (mimid-agent-store credentials,
# 4,096 HMAC-SHA-256 rounds per login) takes about 0.2 s unoptimised;
# the tests log in hundreds of times.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
