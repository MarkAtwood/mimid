[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# Exact pins: OpenMLS's extensions-draft API changes between releases.
openmls = { version = "=0.9.1", features = ["extensions-draft"] }
openmls_rust_crypto = { version = "=0.6.0", features = ["extensions-draft"] }
openmls_sqlite_storage = { version = "=0.3.0", features = ["extensions-draft"] }

# Exact pins: wire encodings and hashes the spec crates must reproduce byte for byte.
# tls_codec must stay the version openmls uses, since mimi-mls re-exports it.
tls_codec = { version = "=0.5.0", features = ["derive", "mls"] }
minicbor = { version = "=2.3.0", features = ["alloc"] }
sha2 = "=0.11.1"
hmac = "=0.13.0"
serde_json = "=1.0.154"
iri-string = { version = "=0.7.14", default-features = false, features = ["alloc"] }

serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tokio = { version = "1.53.3", features = ["full"] }
axum = "0.8.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
toml = "1.1.8"

# Our OpenMLS branch: v0.9.1 plus the GREASE KeyPackage extension fix
# (decision mimid-1wgh.4.11). Every openmls-family crate comes from the same
# commit so they share one openmls_traits; all but openmls are unchanged.
[patch.crates-io]
openmls = { git = "https://github.com/MarkAtwood/openmls", rev = "5abd9e086ca3f8134982c5ea8cab37a228f4ca26" }
openmls_traits = { git = "https://github.com/MarkAtwood/openmls", rev = "5abd9e086ca3f8134982c5ea8cab37a228f4ca26" }
openmls_rust_crypto = { git = "https://github.com/MarkAtwood/openmls", rev = "5abd9e086ca3f8134982c5ea8cab37a228f4ca26" }
openmls_basic_credential = { git = "https://github.com/MarkAtwood/openmls", rev = "5abd9e086ca3f8134982c5ea8cab37a228f4ca26" }
openmls_sqlite_storage = { git = "https://github.com/MarkAtwood/openmls", rev = "5abd9e086ca3f8134982c5ea8cab37a228f4ca26" }
openmls_memory_storage = { git = "https://github.com/MarkAtwood/openmls", rev = "5abd9e086ca3f8134982c5ea8cab37a228f4ca26" }
openmls_serialization_helpers = { git = "https://github.com/MarkAtwood/openmls", rev = "5abd9e086ca3f8134982c5ea8cab37a228f4ca26" }
