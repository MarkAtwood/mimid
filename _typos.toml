[default]
# Content hashes in generated Beads markers.
# base64url test keys (httpsig tests),
# and base58btc multihashes and Ed25519 multikeys (did:webvh SCIDs, entry hashes, keys).
extend-ignore-re = ["hash:[0-9a-f]+", "TEST_KEY_[A-Z]+: &str = \"[A-Za-z0-9_-]+\"", "Qm[1-9A-HJ-NP-Za-km-z]{44}", "z6Mk[1-9A-HJ-NP-Za-km-z]{44}"]

[default.extend-words]
# CBOR Extended Diagnostic Notation (.edn files).
edn = "edn"
# protocol-06 §5.6 GroupInfoRatchetTreeTBE (to-be-encrypted).
tbe = "tbe"
# "café" written with an escape for its é in the Unicode stress tests.
caf = "caf"
# CBOR Object Signing and Encryption (RFC 9052).
cose = "cose"
# XMPP Multi-User Chat (XEP-0045).
muc = "muc"

[files]
# Vendored mimi-content WG examples: EDN and diagnostic dumps are full of hex.
# The Big List of Naughty Strings, base64: random letter runs.
# did:webvh logs and the did_webvh vectors: base58btc keys, hashes and signatures.
# Plaintext store fixtures: generated ULIDs, hex message IDs and keys.
extend-exclude = ["crates/mimid-agent-store/tests/fixtures/*/chat.json", "*.edn", "*.pretty", "crates/mimi-content/tests/fixtures/blns/blns.base64.txt", "crates/mls-didwebvh/tests/fixtures/", "crates/mls-didwebvh/tests/vectors/vectors.json"]
