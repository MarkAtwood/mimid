[default]
# Content hashes in generated Beads markers.
extend-ignore-re = ["hash:[0-9a-f]+"]

[default.extend-words]
# CBOR Extended Diagnostic Notation (.edn files).
edn = "edn"
# protocol-06 §5.6 GroupInfoRatchetTreeTBE (to-be-encrypted).
tbe = "tbe"
# "café" written with an escape for its é in the Unicode stress tests.
caf = "caf"

[files]
# Vendored mimi-content WG examples: EDN and diagnostic dumps are full of hex.
# The Big List of Naughty Strings, base64: random letter runs.
extend-exclude = ["*.edn", "*.pretty", "crates/mimi-content/tests/fixtures/blns/blns.base64.txt"]
